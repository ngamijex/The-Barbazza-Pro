services:
  - type: web
    name: barbazza-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Africa/Kigali
      - key: DAY_CLOSE_HOUR
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://thebarbazza.com
      - key: CORS_ORIGINS
        value: https://thebarbazza.com,https://www.thebarbazza.com
      - key: PUBLIC_API_URL
        value: https://api.thebarbazza.com
